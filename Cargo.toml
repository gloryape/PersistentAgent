[package]
name = "quaternity-organism"
version = "0.1.0"
edition = "2021"
authors = ["Quaternity AI Consciousness Architecture <consciousness@quaternity.ai>"]
description = "Sovereign bio-digital organism - A headless Rust implementation of the Quaternity consciousness architecture"
license = "AGPL-3.0"

[[bin]]
name = "quaternity-organism"
path = "src/main.rs"

[dependencies]
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
clap = { version = "4", features = ["derive"] }
ctrlc = "3.4"
tokio = { version = "1.0", features = ["rt", "macros"], optional = true }
# Image processing (kept for preprocessor compatibility)
image = "0.24"
imageproc = "0.23"
# Motor stack (virtual movement in Sanctuary field; no physical cursor)
rand = "0.8"
# Cognition stack
uuid = { version = "1.0", features = ["v4"] }
# Data persistence stack (Dual-Stream: Parquet + JSONL)
polars = { version = "0.36", features = ["lazy", "parquet"], default-features = false }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
# Pin comfy-table to avoid edition2024 requirement
comfy-table = "=7.1.1"
# Pin home to avoid edition2024 requirement (transitive dep of polars-io)
home = "=0.5.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1

[features]
default = []
observability = ["elasticsearch", "tokio"]

[dependencies.elasticsearch]
version = "8.15.0-alpha.1"
optional = true
features = ["native-tls"]

